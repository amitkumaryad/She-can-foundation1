<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She Can Foundation - Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #4a148c;
        }
        label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.3rem;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            margin-top: 1.2rem;
            width: 100%;
            padding: 0.8rem;
            background: #4a148c;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #6a1b9a;
        }
        .success-message {
            display: none;
            text-align: center;
            color: #388e3c;
            font-weight: bold;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Contact She Can Foundation</h2>
        <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button type="submit">Submit</button>
        </form>
        <div class="success-message" id="successMessage">
            Form Submitted Successfully
        </div>
    </div>
    <script>
        const form = document.getElementById('contactForm');
        const successMessage = document.getElementById('successMessage');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            form.style.display = 'none';
            successMessage.style.display = 'block';
        });
    </script>
</body>
</html>
