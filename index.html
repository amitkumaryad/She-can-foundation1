<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>She Can Foundation Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form { max-width: 400px; margin: auto; display: flex; flex-direction: column; }
    input, textarea, button { margin: 10px 0; padding: 10px; font-size: 1em; }
    button { background: #4CAF50; color: white; border: none; cursor: pointer; }
    button:hover { background: #45a049; }
    .success { color: green; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <h2>Contact She Can Foundation</h2>
  <form id="contactForm">
    <label>Name:</label>
    <input type="text" id="name" required>
    
    <label>Email:</label>
    <input type="email" id="email" required>
    
    <label>Message:</label>
    <textarea id="message" required></textarea>
    
    <button type="submit">Submit</button>
  </form>
  <p id="response" class="success"></p>

  <script>
    document.getElementById("contactForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const res = await fetch("http://localhost:5000/api/submit", {
        method: "GET",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          message: document.getElementById("message").value
        })
      });
      if(res.ok) {
        document.getElementById("response").innerText = "Form Submitted Successfully";
      }
    });
  </script>
</body>
</html>
